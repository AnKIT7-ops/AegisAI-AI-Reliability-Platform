[project]
name = "aegis-backend"
version = "0.1.0"
description = "AegisAI API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
