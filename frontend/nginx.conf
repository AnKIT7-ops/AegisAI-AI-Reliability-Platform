# The only published service. Anything without a location below is a 404,
# including the backend's /metrics, /health and /docs.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Per client address. Behind Docker Desktop all clients can share one address,
# so this can act as a global limit.
limit_req_zone $binary_remote_addr zone=costly:1m rate=2r/s;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    client_max_body_size 2m;
    # Relative, so redirects keep a remapped FRONTEND_PORT.
    absolute_redirect off;

    # Compose's DNS. Upstreams sit in variables so they resolve per request: a
    # missing Grafana cannot stop nginx starting, and a recreated container is found.
    resolver 127.0.0.11 valid=10s;

    proxy_http_version 1.1;
    # The client's Host, not the upstream's: the backend's Host check depends on it.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;

    location / {
        try_files $uri $uri/ =404;
        # Revalidate, or browsers keep showing the old page after an upgrade.
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /api/ {
        set $api http://backend:8000;
        proxy_pass $api;
        # Longer than AEGIS_GENERATE_TIMEOUT_S, so a slow model is not cut off here.
        proxy_read_timeout 180s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Routes that call the model or do heavy work. The burst leaves room for the
    # 30-request drills in docs/runbooks and for uploading the sample documents.
    location ~ ^/api/v1/(chat|documents/ingest|evaluations/run|incidents/(detect|simulate)|demo/load)$ {
        limit_req zone=costly burst=40 nodelay;
        error_page 429 = @rate_limited;
        set $api http://backend:8000;
        proxy_pass $api;
        proxy_read_timeout 180s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"error":{"code":"rate_limited","message":"Too many requests. Try again shortly."}}';
    }

    # Also the Host check for the monitoring paths, with authentication on or off:
    # the backend refuses a foreign Host here, so nginx refuses the request.
    location = /_auth {
        internal;
        set $api http://backend:8000;
        proxy_pass $api/api/v1/auth/check;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
    }

    location @sign_in {
        return 302 /#/login;
    }

    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        auth_request /_auth;
        error_page 401 = @sign_in;
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        # Grafana Live uses a WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /prometheus {
        return 301 /prometheus/;
    }

    # Prometheus keeps its routes at /, so the backend and Grafana reach it unchanged.
    location /prometheus/ {
        auth_request /_auth;
        error_page 401 = @sign_in;
        set $prometheus http://prometheus:9090;
        rewrite ^/prometheus(/.*)$ $1 break;
        proxy_pass $prometheus;
        # Prometheus allows every origin by default.
        proxy_hide_header Access-Control-Allow-Origin;
        # The UI's live notifications are a stream that never ends.
        proxy_buffering off;
    }
}
